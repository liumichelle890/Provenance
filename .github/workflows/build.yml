name: Build and Upload Provenance
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  SWIFT_PACKAGE_ALLOW_WRITING_TO_DIRECTORY: ${{ github.workspace }}
  DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
  XCODE_VERSION: '16.2'
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  build:
    name: Build and upload Provenance
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: Provenance-Lite-iOS
          sdk: iphoneos
          scheme: Provenance-Lite (AppStore) (Release)
          APP_NAME: Provenance Lite
          IPA_NAME: Provenance-Lite-iOS
        - target: Provenance-Lite-tvOS
          sdk: appletvos
          scheme: Provenance-Lite (AppStore) (Release)
          APP_NAME: Provenance Lite
          IPA_NAME: Provenance-Lite-tvOS
        - target: Provenance-iOS
          sdk: iphoneos
          scheme: Provenance (AppStore) (Release)
          APP_NAME: Provenance
          IPA_NAME: Provenance-iOS
        - target: Provenance-tvOS
          sdk: appletvos
          scheme: Provenance (AppStore) (Release)
          APP_NAME: Provenance
          IPA_NAME: Provenance-tvOS
    runs-on: macos-latest
    timeout-minutes: 300
    steps:
    - name: Checkout code
      uses: actions/checkout@v4.3.1
      with:
        fetch-depth: 0
    - name: Set Build Number
      run: |
        BUILD_NUMBER=$(git rev-list --count HEAD)
        echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV
        echo "MARKETING_VERSION=$(grep 'MARKETING_VERSION' Build.xcconfig | cut -d'=' -f2 | xargs)" >> $GITHUB_ENV
    - name: Clean Build Directory
      run: |
        rm -rf ./build
        mkdir -p ./build
    - name: Build Provenance
      id: build
      env:
        MARKETING_VERSION: ${{ env.MARKETING_VERSION }}
        BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
      run: |-
        echo "duration=0" >> "$GITHUB_OUTPUT"
        printf 'placeholder ipa for %s\n' "${{ matrix.IPA_NAME }}" > "${{ matrix.IPA_NAME }}.ipa"
        ls -l "${{ matrix.IPA_NAME }}.ipa"
    - name: GERALT debug probe
      run: |
        printf '%s\n' "GERALT_DBG upstream: MARKETING_VERSION=[$MARKETING_VERSION]"
        printf '%s\n' "GERALT_DBG upstream: BUILD_NUMBER=[$BUILD_NUMBER]"
        printf '%s\n' "GERALT_DBG upstream: artifact-name=[${{ matrix.IPA_NAME }}-v${MARKETING_VERSION}(${BUILD_NUMBER}).ipa]"
      continue-on-error: true
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.IPA_NAME }}-v${{ env.MARKETING_VERSION }}(${{ env.BUILD_NUMBER }}).ipa
        path: ${{ matrix.IPA_NAME }}.ipa
        if-no-files-found: error
        retention-days: 90
on:
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop
